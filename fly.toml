app = "book-brewery"
primary_region = "iad"

[build]

[env]
  ANTHROPIC_MODEL = "claude-opus-4-7"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
